[project]
name = "papery"
package-mode = false
version = "0.1.0"
description = "Agentic AI application for telling you the weather throughout your planned drive."
authors = [
    {name = "Adam",email = "adamwilliams0401@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "python-dotenv (>=1.2.1,<2.0.0)",
    "openai (>=2.8.1,<3.0.0)",
    "flask (>=3.1.2,<4.0.0)",
    "ipykernel (>=7.1.0,<8.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "anthropic (>=0.75.0,<0.76.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "aiohttp (>=3.13.3,<4.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.1.0"
ruff = "^0.14.10"
mypy = "^1.19.1"

