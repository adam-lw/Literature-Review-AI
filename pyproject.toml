[project]
name = "literature-ai"
version = "0.0.1"
description = "AI Literature Reviews"
authors = [
    {name = "Adam", email = "adamwilliams0401@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "python-dotenv>=1.2.1,<2.0.0",
    "openai>=2.8.1,<3.0.0",
    "flask>=3.1.2,<4.0.0",
    "ipykernel>=7.1.0,<8.0.0",
    "requests>=2.32.5,<3.0.0",
    "anthropic>=0.75.0,<0.76.0",
    "pandas>=2.3.3,<3.0.0",
    "sqlalchemy>=2.0.45,<3.0.0",
    "aiohttp>=3.13.3,<4.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "loguru>=0.7.3,<0.8.0",
    "psycopg2-binary>=2.9.11,<3.0.0",
    "torch>=2.11.0,<3.0.0",
    "streamlit>=1.55.0,<2.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "matplotlib>=3.11.0",
    "requests-cache>=1.3.2",
    "langdetect>=1.0.9",
    "adapters>=1.3.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0,<8.0.0",
    "ruff>=0.14.10",
    "mypy>=1.19.1",
    "types-pyyaml>=6.0.12.20250915",
    "pandas-stubs>=3.0.0.260204",
    "pytest>=9.0.2",
]

[tool.uv]
package = true
