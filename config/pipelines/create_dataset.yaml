# Use with run_pipeline in literature_ai/pipeline/run_pipeline.py

# Stage toggles — set to false to skip a stage
stages:
  collect_papers: false
  clean_paper: false
  embeddings: true

collect_papers:

  # List of queries to run to generate dataset.
  # Each entry is a dict with a required "query" key and optional per-query overrides for
  # research_fields, sort_by, ascending, years, open_access_only, and min_citation_count.
  queries:
    - query: "deep learning"
      research_fields: [Computer Science, Mathematics]
    # - query: "reinforcement learning"
    #   research_fields: [Computer Science]
    # - query: "natural language processing"
    #   research_fields: [Computer Science]
    # - query: "computer vision"
    #   research_fields: [Computer Science]
    # - query: "machine learning diagnostics"
    #   research_fields: [Computer Science, Medicine]
    # - query: "AI assisted drug discovery"
    #   research_fields: [Medicine, Chemistry]

  # Output sorting (global default, overridable per query)
  sort_by: "citationCount"
  ascending: False

  # Date range (as list [start, end], inclusive; global default, overridable per query)
  years: [2015, 2025]

  # N results to save per query
  results_per_query: 200


embeddings:
  # Models to collect from the Semantic Scholar API (specter_v1 or specter_v2)
  collect:
    - specter_v2

  # Models to generate locally (e.g. text-embedding-3-small, text-embedding-3-large)
  generate:
    - text-embedding-3-small

  # Automatically create a HNSW index for each model run above
  create_index: true
  index:
    m: 16
    ef_construction: 64
    distance: cosine
