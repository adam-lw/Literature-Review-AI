# Agent settings for the "chatbot" agent.
#
# tools: list of registered tool names this agent may call. Omit the key
#   entirely (or delete this file) to give the agent every registered tool.
# llm: model name to run the agent on.
# allow_questions: whether the agent may pause and ask the user a clarifying
#   question via the `ask_user` tool.

tools: []
llm: dummy
allow_questions: true
