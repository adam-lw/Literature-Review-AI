services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: literature_ai
      POSTGRES_USER: literature_ai
      POSTGRES_PASSWORD: literature_ai
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U literature_ai -d literature_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  grobid:
    # Lightweight rule-based image by default (much lower RAM than the full deep-learning
    # variant, at the cost of noticeably worse section/reference detection). Set
    # GROBID_IMAGE_TAG=0.8.2 in .env for the full deep-learning variant instead (best parse
    # quality, ~4GB RAM) — same REST API either way, so nothing else needs to change.
    image: lfoppiano/grobid:${GROBID_IMAGE_TAG:-0.8.2-crf}
    ports:
      - "8070:8070"
    healthcheck:
      # The image has neither curl nor wget (Debian-slim JRE base). CMD-SHELL runs via
      # /bin/sh (dash), which doesn't support /dev/tcp, so invoke bash explicitly and
      # check for a 200 status line in the raw HTTP response.
      test:
        [
          "CMD",
          "bash",
          "-c",
          'exec 3<>/dev/tcp/localhost/8070 && printf "GET /api/isalive HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep -q "200"',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  api:
    build: .
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: literature_ai
      PGPASSWORD: literature_ai
      PGDATABASE: literature_ai
      GROBID_URL: http://grobid:8070
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - api_venv:/opt/venv
    depends_on:
      postgres:
        condition: service_healthy
      grobid:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_DEV_API_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  api_venv:
  frontend_node_modules:
